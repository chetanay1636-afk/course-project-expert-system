<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Course Project Recommendation Expert System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Course Project Recommendation Expert System</h1>

        <p class="subtitle">
            Select your interests and skills to get detailed project recommendations.
        </p>

        <div class="form-box">

            <label>Enter Your Name</label>

            <input type="text"
                   id="studentName"
                   placeholder="Enter your name">

            <h2>Select Skills and Interests</h2>

            <div class="checkbox-group">

                <label>
                    <input type="checkbox" id="programming">
                    Likes Programming
                </label>

                <label>
                    <input type="checkbox" id="ai">
                    Interested in AI
                </label>

                <label>
                    <input type="checkbox" id="webdev">
                    Interested in Web Development
                </label>

                <label>
                    <input type="checkbox" id="problemSolving">
                    Good at Problem Solving
                </label>

                <label>
                    <input type="checkbox" id="creative">
                    Creative Person
                </label>

                <label>
                    <input type="checkbox" id="dataAnalysis">
                    Interested in Data Analysis
                </label>

                <label>
                    <input type="checkbox" id="design">
                    Likes Designing
                </label>

                <label>
                    <input type="checkbox" id="automation">
                    Interested in Automation
                </label>

            </div>

            <button onclick="generateRecommendation()">
                Get Recommendation
            </button>

            <button class="reset-btn"
                    onclick="resetForm()">
                Reset
            </button>

        </div>

        <div id="result" class="result-box"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
